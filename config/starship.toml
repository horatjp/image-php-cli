format = """
$container\
$all
"""

right_format = "$time"

[character]
disabled = false
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[cmd_duration]
disabled = false
min_time = 1000
format = '[ 󱎫 $duration ](white dimmed)'

[container]
disabled = false
format = "[ ](white dimmed)"

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[󰝰 $path ](bold cyan)"

[fill]
symbol = " "

[git_branch]
disabled = false
format = '[ $branch](white dimmed) '

[git_status]
disabled = false
format     = '[$all_status$ahead_behind](white dimmed) '
ahead      = '[\(${count}⇡\)](green dimmed)'
behind     = '[\(${count}⇣\)](red dimmed)'
diverged   = '[\(${ahead_count}⇡${behind_count}⇣\)](purple dimmed)'
conflicted = '[  ](bold orange dimmed)'
stashed    = '[  ${count} ](white dimmed)'
staged     = '[󰐕${count} ](cyan dimmed)'
untracked  = '[󰻭 ${count} ](green dimmed)'
modified   = '[ ${count} ](yellow dimmed)'
deleted    = '[󱀷 ${count} ](red dimmed)'

[hostname]
disabled = true
ssh_only = false
format = "[$hostname](white dimmed) "

[memory_usage]
disabled = false
threshold = 70
format = "[ Mem(${ram_pct})](bold red) "

[package]
disabled = true

[time]
disabled = true
format = '[ $time ](white dimmed)'
time_format = '%Y-%m-%d %R'

[username]
disabled = true
show_always = true
format = "[ $user](bold blue dimmed) "

# Language modules
[aws]
format = "[$symbol($profile )]($style)"

